services:
  postgres:
    image: postgres:18-alpine
    container_name: localChatDB
    restart: always
    environment:
      POSTGRES_DB: localChatDB
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
